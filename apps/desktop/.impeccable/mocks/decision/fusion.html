  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1180px;height:738px;overflow:hidden;}

  .p-foot{height:34px;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--hair);font-size:10.5px;color:var(--ter);background:rgba(255,255,255,.5);}

    position:absolute;left:22px;right:22px;bottom:22px;height:68px;z-index:30;

    box-shadow:0 20px 44px -16px rgba(29,30,32,.26);
    display:flex;align-items:center;gap:14px;padding:0 18px;
  }
  .pc{width:32px;height:32px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px -2px rgba(94,109,210,.5);transition:transform .15s ease;}
  .pc:hover{transform:scale(1.06);}
  .pskip{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--sub);}
  .pskip:hover{background:rgba(29,30,32,.06);color:var(--ink);}

  .pmeta .ep{font-size:11px;color:var(--sub);}
  .pmeta .nm{font-size:13px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ptrack{flex:1;display:flex;align-items:center;gap:12px;}
  .pt{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none;}
  .pbar{flex:1;height:3px;border-radius:999px;background:rgba(29,30,32,.1);position:relative;cursor:pointer;}
  .pbar b{position:absolute;left:0;top:0;bottom:0;width:26%;border-radius:999px;background:var(--accent);}
  .pbar i{position:absolute;left:26%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.9);}
  .chip{font-size:11px;color:var(--sub);background:rgba(29,30,32,.06);border-radius:6px;padding:2.5px 8px;flex:none;}
  .expand{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ter);}
  .expand:hover{background:rgba(29,30,32,.06);color:var(--ink);}

  .synthetic{position:absolute;right:36px;bottom:100px;font-size:10px;color:var(--ter);letter-spacing:.1em;z-index:5;}
  .hintbar{position:absolute;left:36px;bottom:100px;font-size:10.5px;color:var(--ter);z-index:5;letter-spacing:.03em;}
  .hintbar b{color:var(--sub);font-weight:600;}

  DIRECTION CONTRACT · Lettura 0.2.0 「静密 × 聚光」
  THESIS: 界面是一台睡在玻璃上的精密仪器——排版做层级，键盘做导航，命令面板做入口；内容即界面，读完就走。
  OWN-WORLD: 暖灰画布＋双色环境光上的磨砂玻璃面板；靓蓝单强调色；发丝线列表行；20px 类型徽章（文/播/B/抖）；全局浮动玻璃播放卡；⌘K 命令面板。

  FORM: 静密（Linear 谱系）× 聚光（Raycast/Arc 谱系）融合；用户两轮选定，复古/材质隐喻整体否决；seed bcc3aef8。

-->

];
const KLABEL={art:["文","b-art"],pod:["播","b-pod"],bil:["B","b-bil"],dou:["抖","b-dou"]};
const KINDNAME={art:"文章",pod:"播客 · 单集",bil:"Bilibili",dou:"抖音"};
let focusIdx=1,view="list",playing=true;

const vl=document.getElementById("viewList");
function renderList(){
  vl.innerHTML=ROWS.map((r,i)=>`
   <div class="row ${r.read?"read":""} ${i===focusIdx?"focus":""}" data-i="${i}">
     <span class="st"><span class="dot"></span></span>
     <span class="badge ${KLABEL[r.k][1]}">${KLABEL[r.k][0]}</span>
     <span class="t">${r.t}</span>
     <span class="s">${r.s}</span>
     <span class="d">${r.d}</span>
     <span class="acts">${r.star?'<svg class="star" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.8l1.85 3.9 4.3.55-3.2 2.9.85 4.2L8 11.3l-3.8 2.05.85-4.2-3.2-2.9 4.3-.55z"/></svg>':""}</span>
   </div>`).join("");
  vl.querySelectorAll(".row").forEach(el=>el.addEventListener("click",()=>{focusIdx=+el.dataset.i;openDetail(focusIdx);}));
}
function setFocus(i){focusIdx=Math.max(0,Math.min(ROWS.length-1,i));renderList();}

const ARTICLES={
 1:{body:`<p>五年里我换过四个稍后读应用、三个聚合器、两套笔记系统。每一件都 promising 地开始，都以同一个症状结束：收藏的东西越来越多，读完的越来越少。</p><p>问题不在工具，在形态。稍后读是一个承诺——「以后读」——而「以后」是一个永远不会到来的时间点。RSS 不承诺任何东西，它只是把今天到了的东西放在门口，你拿走多少算多少。</p><p>于是我退回了最老的协议。未读 247 不是债务，只是今天的天气。</p>`},
};
const DETAILS={
 pod:`<div class="d-inner">
   <div class="d-kind">播客 · 单集</div>
   <div class="ep-head">
     <span class="cover"><svg width="40" height="40" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7.5v5M7.3 5v10M10.6 8v4M14 6v8M17.3 7.5v5"/></svg></span>
     <div class="ep-info">
       <h1>EP.87 与 guevaria 聊本地优先软件</h1>
       <div class="d-meta"><span>内核恐慌</span>·<span>72:00</span>·<span>已播放 26%</span></div>
       <div class="ep-ctrl">
         <button class="bigplay" onclick="togglePlay()"><svg width="13" height="13" viewBox="0 0 12 12" fill="#fff"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg></button>
         <button class="skipbtn">−30s</button><button class="skipbtn">+30s</button>
         <span class="chip">1.5×</span>
       </div>
     </div>
   </div>
   <p class="note">本地优先不是离线优先。这一期我们聊为什么「数据在你手里」和「断网可用」是两件事，以及 2026 年的本地同步栈（CRDT、SQLite、文件系统）成熟到了什么程度。嘉宾 guevaria 是本地优先工具的开发者。</p>
   <div class="chapters">
     <div class="ch-h">章节 CHAPTERS</div>
     <div class="ch now"><span class="ts">00:00</span><span class="tt">开场：什么是本地优先</span></div>
     <div class="ch"><span class="ts">18:30</span><span class="tt">SQLite 与文件同步的现实</span></div>
     <div class="ch"><span class="ts">41:12</span><span class="tt">CRDT 适合谁</span></div>
     <div class="ch"><span class="ts">58:40</span><span class="tt">问答：迁移成本</span></div>
   </div>
 </div>`,
 bil:`<div class="d-inner">
   <div class="d-kind" style="color:var(--pink)">Bilibili · 经 RSSHub</div>
   <div class="plat-cover"><svg width="44" height="44" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 4.5 8 7M14 4.5 12 7M4 7h12v8.5H4zM8 10.5v2M12 10.5v2"/></svg></div>
   <h1>【B站】2026 年的本地模型到底能干什么</h1>
   <div class="d-meta"><span>科技 UP 主</span>·<span>昨日 23:07</span>·<span>视频 · 18:42</span></div>
   <p class="note">用三台不同年代的 Mac 跑了同一组本地模型任务：摘要、翻译、代码补全、RAG。结论比想象中乐观，但瓶颈不在算力，在内存带宽。本期数据全部开源在简介里。</p>
   <button class="openbtn">在 Bilibili 打开
     <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 3H3v10h10V9.5M9 3h4v4M12.8 3.2 7.5 8.5"/></svg>
   </button>
   <p class="note" style="margin-top:22px;color:var(--ter);font-size:12px;">视频在平台播放；这里渲染 feed 提供的封面与简介。</p>
 </div>`,
};

function openDetail(i){
  const r=ROWS[i];
  const isPod=r.k==="pod",isPlat=r.k==="bil"||r.k==="dou";
  const body= isPod?DETAILS.pod : isPlat?DETAILS.bil :
    `<div class="d-inner"><div class="d-kind">${KINDNAME[r.k]}</div><h1>${r.t}</h1>
     <div class="d-meta"><span>${r.s.replace(/<[^>]+>/g,"")}</span>·<span>${r.d}</span>·<span>约 8 分钟</span></div>
     ${(ARTICLES[i]||ARTICLES[1]).body}</div>`;
  document.getElementById("dBody").innerHTML=body;
  document.getElementById("dSrc").textContent=`${r.s.replace(/<[^>]+>/g,"")} · ${r.d}`;
  document.getElementById("viewList").style.display="none";
  document.getElementById("listStrip").style.display="none";
  document.getElementById("viewDetail").style.display="flex";
  document.getElementById("hintbar").innerHTML="<b>esc</b> 返回列表 · <b>j/k</b> 下一篇 · <b>m</b> 已读并下移";
  view="detail";
}
function backToList(){
  document.getElementById("viewDetail").style.display="none";
  document.getElementById("viewList").style.display="block";
  document.getElementById("listStrip").style.display="flex";
  document.getElementById("hintbar").innerHTML="<b>j/k</b> 移动 · <b>⏎</b> 打开 · <b>m</b> 已读 · <b>f</b> 星标 · <b>space</b> 播放 · <b>⌘K</b> 命令";
  view="list";renderList();
}
document.getElementById("backBtn").addEventListener("click",backToList);
document.getElementById("pmetaClick").addEventListener("click",()=>openDetail(2));
document.getElementById("expandBtn").addEventListener("click",()=>openDetail(2));

function togglePlay(){
  playing=!playing;
  document.getElementById("playBtn").innerHTML=playing
   ?'<svg width="11" height="11" viewBox="0 0 12 12" fill="#fff"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg>'
   :'<svg width="11" height="11" viewBox="0 0 12 12" fill="#fff"><path d="M2.5 1.2v9.6l8-4.8z"/></svg>';
}
document.getElementById("playBtn").addEventListener("click",togglePlay);

/* 命令面板 */
const veil=document.getElementById("veil"),pal=document.getElementById("palette"),pin=document.getElementById("pInput"),pres=document.getElementById("pRes");
const CMDS=[
 {ic:"文",cls:"b-art",l:"Rust 1.90 发布：编译器并行化进入第二阶段",h:"rust-lang.org · 09:41",i:0},
 {ic:"文",cls:"b-art",l:"为什么我把全部阅读搬回了 RSS",h:"overreacted.io · 08:52",i:1},
 {ic:"播",cls:"b-pod",l:"EP.87 与 guevaria 聊本地优先软件",h:"内核恐慌 · 72:00",i:2},
 {ic:"B",cls:"b-bil",l:"【B站】2026 年的本地模型到底能干什么",h:"科技 UP 主 · 昨日",i:3},
 {ic:"抖",cls:"b-dou",l:"【抖音】三分钟看懂编译器并行化",h:"抖音 · 昨日",i:4},
 {ic:"＋",cls:"b-art",l:"添加订阅（含 B站 / 抖音 / Newsletter 平台源）",h:"命令",i:-1},
 {ic:"↻",cls:"b-art",l:"刷新全部来源",h:"命令 · R",i:-1},
];
let pOpen=false;
function renderPal(q=""){
  const ql=q.toLowerCase();
  const hits=CMDS.filter(c=>c.l.toLowerCase().includes(ql));
  pres.innerHTML=hits.map((c,idx)=>`
   <div class="r ${idx===0?"sel":""}" data-i="${c.i}">
     <span class="ic ${c.cls}">${c.ic}</span>
     <span class="lbl">${c.l}</span><span class="hint">${c.h}</span><kbd>⏎</kbd>
   </div>`).join("")||`<div style="padding:18px 16px;font-size:13px;color:var(--ter);">没有匹配</div>`;
  document.getElementById("pCount").textContent=`共 ${hits.length} 项`;
  pres.querySelectorAll(".r").forEach(el=>el.addEventListener("click",()=>{
    closePal(); if(+el.dataset.i>=0) openDetail(+el.dataset.i);
  }));
}
function openPal(){pOpen=true;veil.style.display="block";pal.style.display="block";pin.value="";renderPal();pin.focus();}
function closePal(){pOpen=false;veil.style.display="none";pal.style.display="none";}
document.getElementById("openPalette").addEventListener("click",openPal);
veil.addEventListener("click",closePal);
pin.addEventListener("input",e=>renderPal(e.target.value));

document.addEventListener("keydown",e=>{
  if(pOpen){
    if(e.key==="Escape"){closePal();e.preventDefault();}
    if(e.key==="Enter"){
      const first=pres.querySelector(".r");
      if(first){closePal(); if(+first.dataset.i>=0) openDetail(+first.dataset.i);}
      e.preventDefault();
    }
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){openPal();e.preventDefault();return;}
  if(view==="list"){
    if(e.key==="j"||e.key==="ArrowDown"){setFocus(focusIdx+1);e.preventDefault();}
    if(e.key==="k"||e.key==="ArrowUp"){setFocus(focusIdx-1);e.preventDefault();}
    if(e.key==="Enter"||e.key==="o"){openDetail(focusIdx);e.preventDefault();}
    if(e.key==="m"){ROWS[focusIdx].read=true;setFocus(focusIdx+1);e.preventDefault();}
    if(e.key==="f"){ROWS[focusIdx].star=!ROWS[focusIdx].star;renderList();e.preventDefault();}
  }else{
    if(e.key==="Escape"){backToList();e.preventDefault();}
    if(e.key==="j"){setFocus(focusIdx+1);openDetail(focusIdx);e.preventDefault();}
    if(e.key==="k"){setFocus(focusIdx-1);openDetail(focusIdx);e.preventDefault();}
    if(e.key==="m"){ROWS[focusIdx].read=true;setFocus(focusIdx+1);openDetail(focusIdx);e.preventDefault();}
  }
  if(e.key===" "){togglePlay();e.preventDefault();}
});

renderList();
</script>
</body>
</html>
