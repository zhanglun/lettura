[package]
name = "lettura"
version = "0.2.0"
description = "Follow your favorite content and never miss a story"
authors = ["zhanglun1410@gmail.com"]
license = "GPL-3.0-only"
repository = "https://github.com/zhanglun/lettura"
default-run = "lettura"
edition = "2021"
build = "src/build.rs"

[lib]
name = "lettura_lib"
crate-type = ["staticlib", "cdylib", "lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 订阅源抓取器家族（packages/）：trait 与各来源实现
fetcher-core = { path = "../../../packages/fetcher-core" }
fetcher-rss = { path = "../../../packages/fetcher-rss" }
fetcher-mail = { path = "../../../packages/fetcher-mail" }
fetcher-bilibili = { path = "../../../packages/fetcher-bilibili" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png", "image-ico", "macos-private-api"] }
reqwest = { version = "0.11", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
chrono = { version="^0.4", features = ["serde"] }
diesel = { version = "2.0.2", features = ["sqlite", "chrono", "uuid", "returning_clauses_for_sqlite_3_35", "serde_json"] }
diesel_migrations = { version = "2.0.0", features = ["sqlite"] }
libsqlite3-sys = { version = "^0", features = ["bundled"] }
dotenv = "0.15.0"
uuid = { version = "1.2.1", features = [ "v4", "fast-rng", "macro-diagnostics" ] }
toml = "0.7.3"
scraper = "0.17.1"
regex = "1"
url="*"
base64="*"
once_cell = "*"
log= { version = "^0.4" }
env_logger="*"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.13"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.6"
tauri-plugin-notification = "2"
actix-web = "4.4.0"
actix-cors = "*"
sys-info = "0.9"
async-openai = { version = "0.36", features = ["embedding", "chat-completion"] }
async-trait = "0.1"

# macOS 红绿灯定位（wry 的 trafficLightPosition 只拉高标题栏容器、不动按钮纵向，
# 配置字段无法对齐自绘顶栏）：直接操作 NSWindow 标准按钮 frame。
# 版本对齐 tauri 2.10 依赖树（objc2 0.6 / objc2-app-kit 0.3），不引入新编译单元
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSResponder", "NSView", "NSWindow"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
