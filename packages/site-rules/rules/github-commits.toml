# 内置示例：GitHub 仓库提交（JSON API 型规则的最小示范）
# 粘贴 github.com/{owner}/{repo} 即命中；GitHub 未认证 API 限 60 次/小时，
# 失败时探测分发会自动回落到 RSS 发现层（仓库页面自带 commits.atom）。

[route]
key = "github-commits"
pattern = 'github\.com/(?P<owner>[\w.-]+)/(?P<repo>[\w.-]+)'
title = "GitHub · {owner}/{repo}"

[route.fetch]
url = "https://api.github.com/repos/{owner}/{repo}/commits?per_page=30"
type = "json"

[route.item]
list = "$[*]"
title = "$.commit.message"
link = "$.html_url"
date = "$.commit.author.date"
author = "$.commit.author.name"
